services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodegoat-app
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:admin_password@mongo:27017/nodegoat?authSource=admin
      - DB_USER=admin
      - DB_PASSWORD=admin_password
    command: ["sh", "-c", "node artifacts/ensure-default-admin.js && npm start"]
    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - nodegoat-network
    volumes:
      - ./app:/app/app
      - ./views:/app/views
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/login', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  mongo:
    image: mongo:4.4
    container_name: nodegoat-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin_password
      - MONGO_INITDB_DATABASE=nodegoat
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - nodegoat-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  nodegoat-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
