version: '3.8'

services:
  # -------------------------------------------------------------
  # Component 1: Frontend Web Presentation Layer (Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: taskshield-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - dmz-network
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------
  # Component 2: Backend API & Business Logic Layer
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskshield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/data/taskshield.sqlite
      # Secret supplied via .env or runtime injection (no plaintext committed in code)
      - JWT_SECRET=${JWT_SECRET:-production_secure_dynamic_token_key_min_32_chars_2026!}
      - JWT_EXPIRES_IN=15m
      - VAULT_ENABLED=${VAULT_ENABLED:-false}
    volumes:
      - taskshield-data:/app/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

# -------------------------------------------------------------
# Micro-segmented Networks defining Trust Boundaries
# -------------------------------------------------------------
networks:
  # DMZ Network: Exposed to external clients/browsers
  dmz-network:
    driver: bridge
  # App Network: Internal isolated network for service-to-service communication
  app-network:
    driver: bridge

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  taskshield-data:
    name: taskshield-sqlite-storage
