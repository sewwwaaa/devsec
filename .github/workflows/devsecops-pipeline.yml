name: DevSecOps Pipeline

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  #full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      #SAST
      - name: Install Semgrep
        run: |
          pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST Scan
        id: semgrep
        run: |
          echo "Running semgrep SAST scan"
          semgrep --config p/owasp-top-ten --config p/security-audit --config p/nodejs \
          app/ --json --output semgrep-results.json || true

          echo ""
          echo "Semgrep Reults:"
          if [ -f semgrep-results.json ]; then
            jq '.results | length' semgrep-results.json
            jq '.results[] | select(.extra.severity == "ERROR") | .message' semgrep-results.json || echo "No critical errors"
          fi

      - name: Check Semgrep Results
        run: |
          if [ ! -f semgrep-results.json ]; then
            echo "No security issues found"
            exit 0
          fi

          CRITICAL=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json)
          TOTAL=$(jq '.results | length' semgrep-results.json)

          echo ""
          echo "==SAST GAte Results=="
          echo "Total findings: $TOTAL"
          echo "Critical (ERROR) findings: $CRITICAL"
          echo ""

          if [ $CRITICAL -gt 10 ]; then
            echo "SAST gate FAILED: Too many critical findings ($CRITICAL > 10)"
            exit 1
          fi

          echo "SAST gate PASSED"

      - name: Upload Semgrep Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

