      #     path: npm-audit-results.json



        #Secrets scaning
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          #GITLEAKS_NOTIFY_USER_LIST: "false"

      #container image scaning
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: |
          echo "Building docker image"
          docker build -t nodegoat:latest .
          docker tag nodegoat:latest nodegoat:${{ github.sha }}
          echo "Docker image built successfully"

      - name: Run Trivy Scan
        #uses: aquasecurity/trivy-action@master
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: image
          image-ref: nodegoat:latest
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy Report
        if: ${{ always() && hashFiles('trivy-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore

      

      #pipeline summery
      - name: Pipeline Summary
        if: always()
        run: |
          echo ""
          echo "== Pipeline Summary =="
          echo ""
          echo "1. SAST"
          echo "2. Dependency scannning"
          echo "3. Secrets scaninng"
          echo "4. Container scanning"
          echo ""
          echo "Results in Artifacts section"

      - name: Notify Success
        if: success()
        run: |
          echo ""
          echo "BUILD OK"
          echo ""

      - name: Notify Failure
        if: failure()
        run: |
          echo ""
          echo "BUILD BLOCKED"
          echo ""
          exit 1
