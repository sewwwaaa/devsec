name: Gate Failure Demonstration (Blocking Vulnerable Build)

on:
  workflow_dispatch:
    inputs:
      gate_to_fail:
        description: 'Select security gate to demonstrate failure'
        required: true
        default: 'npm-audit-sca'
        type: choice
        options:
          - 'npm-audit-sca'
          - 'gitleaks-secret'
          - 'semgrep-sast'
          - 'trivy-container'

jobs:
  demonstrate-pipeline-block:
    name: 🛑 Enforce Security Gate Threshold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------------------------------------------
      # Scenario A: SCA Gate Blocks Build on High Vulnerability
      # -------------------------------------------------------------
      - name: Demonstrate SCA Gate Failure (npm audit)
        if: ${{ inputs.gate_to_fail == 'npm-audit-sca' || github.event_name != 'workflow_dispatch' }}
        working-directory: ./backend
        run: |
          echo "=========================================================="
          echo "🛡️ DEVSECOPS SECURITY GATE ENFORCEMENT: SCA DEPENDENCY CHECK"
          echo "Policy: Zero tolerance for CRITICAL or HIGH vulnerabilities"
          echo "=========================================================="
          # Running npm audit at high threshold fails the pipeline with exit code 1
          # because vulnerable transitive packages exist before fix
          npm audit --audit-level=high

      # -------------------------------------------------------------
      # Scenario B: Secret Scanning Gate Blocks Build on Leaked Secret
      # -------------------------------------------------------------
      - name: Demonstrate Gitleaks Gate Failure
        if: ${{ inputs.gate_to_fail == 'gitleaks-secret' }}
        run: |
          echo "Simulating developer accident committing unencrypted private key..."
          echo "AWS_SECRET_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE123456789" > dummy_leaked_secret.txt
          npx gitleaks detect --no-git --source . --verbose

      # -------------------------------------------------------------
      # Scenario C: SAST Gate Blocks Build on SQL Injection Pattern
      # -------------------------------------------------------------
      - name: Demonstrate SAST Gate Failure (Semgrep)
        if: ${{ inputs.gate_to_fail == 'semgrep-sast' }}
        run: |
          python3 -m pip install semgrep
          semgrep scan --config .semgrep.yml --error backend/src/controllers/authController.js
